[package]
description          = "Bevy MToon shader."
edition.workspace    = true
keywords             = ["bevy", "shader", "toon"]
license.workspace    = true
name                 = "bevy_shader_mtoon"
repository.workspace = true
version.workspace    = true

[lints]
workspace = true

[dependencies]
bevy = { default-features = false, features = [
  "bevy_asset",
  "bevy_pbr",
  "bevy_window",
], workspace = true }
bevy_mod_outline = { branch = "bevy-0.17", git = "https://github.com/komadori/bevy_mod_outline" }
bitflags = "2.10.0"

[dev-dependencies]
bevy                           = { default-features = true, workspace = true }
bevy_egui.workspace            = true
bevy_panorbit_camera.workspace = true
